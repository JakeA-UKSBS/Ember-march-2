<title>Ember March</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen war table — control strip, pannable map viewport, command panel. Single dark look by choice. */
:root{
  --ink:#151720; --panel:#1e2130; --panel2:#262a3c; --line:#30364b; --fg:#ebe6d6; --muted:#9b9db0;
  --blue:#4f8fd8; --red:#d4543f; --gold:#d8b15a; --green:#72c07a;
  --display:"Alegreya SC", Georgia, serif; --body:"Alegreya Sans", system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--ink);color:var(--fg);height:100%}
body{font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.wrap{max-width:520px;margin:0 auto;padding-inline:12px;padding-block:8px 16px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:baseline;gap:8px}
h1{font-family:var(--display);font-size:20px;margin:0;letter-spacing:.04em;color:var(--gold);flex:1;min-width:0}
.turn{font-family:var(--display);font-size:13px;color:var(--muted);letter-spacing:.06em}
.bar{display:flex;gap:6px;align-items:center}
.bar .sp{flex:1}
button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:8px 10px;cursor:pointer;touch-action:manipulation;font-size:14px}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button.on{border-color:var(--red);color:var(--red)}
button.go{background:var(--gold);color:#1a1408;border-color:var(--gold)}
button.pulse{animation:pulse 1.2s infinite}
button.mini{padding:4px 8px;font-size:12px}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 35%,transparent)}}

.vp{position:relative;height:max(300px,calc(100svh - 320px));overflow:hidden;border:2px solid var(--line);border-radius:6px;background:#0d0e14;touch-action:none}
.board{position:absolute;left:0;top:0;transform-origin:0 0;display:grid}
.tile{position:relative;width:48px;height:48px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.16);image-rendering:pixelated}
.tile::before,.tile::after{content:"";position:absolute;pointer-events:none}
.tile::after{inset:0}
.t-plain{background:#56653f}
.t-forest{background:radial-gradient(circle at 30% 35%,#24361c 0 18%,transparent 19%),radial-gradient(circle at 70% 65%,#24361c 0 20%,transparent 21%),radial-gradient(circle at 72% 25%,#2b4122 0 12%,transparent 13%),#384b2c}
.t-hill{background:linear-gradient(135deg,transparent 48%,#5b4a2f 49% 54%,transparent 55%),linear-gradient(45deg,transparent 48%,#8d7650 49% 54%,transparent 55%),#76613f}
.t-water{background:repeating-linear-gradient(170deg,transparent 0 7px,rgba(255,255,255,.08) 7px 9px),#2c4762}
.t-bridge{background:repeating-linear-gradient(90deg,#7a5a39 0 6px,#5e432a 6px 7px)}
.t-fort{background:#66656f;box-shadow:inset 0 0 0 3px #4d4c55,inset 0 0 0 5px #7d7c86}
.t-floor{background:linear-gradient(90deg,rgba(0,0,0,.18) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(rgba(0,0,0,.18) 1px,transparent 1px) 0 0/24px 24px,#5d5a66}
.t-wall{background:linear-gradient(rgba(0,0,0,.35) 2px,transparent 2px) 0 0/100% 12px,linear-gradient(90deg,rgba(0,0,0,.35) 2px,transparent 2px) 0 0/16px 24px,#34313d}
.t-throne{background:linear-gradient(90deg,transparent 30%,#6a2b4f 30% 70%,transparent 70%),#5d5a66}
.t-throne::before{left:28%;right:28%;top:14%;bottom:30%;background:#d8b15a;border:2px solid #3b2a12;border-radius:6px 6px 2px 2px}
.t-village,.t-chest{background:#56653f}
.mv::after{background:color-mix(in srgb,var(--blue) 50%,transparent)}
.atk::after{background:color-mix(in srgb,var(--red) 42%,transparent)}
.hl::after{background:color-mix(in srgb,var(--green) 45%,transparent)}
.dg::after{background:color-mix(in srgb,var(--red) 26%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--red) 60%,transparent)}
.tg::after{box-shadow:inset 0 0 0 3px var(--gold);animation:pulse 1s infinite}
.cur::after{box-shadow:inset 0 0 0 3px var(--fg)}

.unit{position:absolute;width:48px;height:48px;pointer-events:none;transition:left .26s ease,top .26s ease,transform .15s ease,opacity .35s}
.unit img{width:48px;height:48px;image-rendering:pixelated;display:block}
.unit.e img{transform:scaleX(-1)}
.unit.boss img{filter:drop-shadow(0 0 2px var(--gold))}
.unit.done img{filter:grayscale(.9) brightness(.65)}
.unit.flash img{filter:brightness(3)}
.hpb{position:absolute;left:8px;right:8px;bottom:2px;height:3px;background:rgba(0,0,0,.6);border-radius:2px}
.hpb i{display:block;height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.unit.e .hpb i{background:#f0a35e}
.pop{position:absolute;width:48px;text-align:center;font-weight:700;font-size:16px;pointer-events:none;text-shadow:0 1px 2px #000,0 0 3px #000;animation:rise .9s forwards;z-index:5}
.pop.dmg{color:#ffd9cf}.pop.miss{color:#c9cbd8}.pop.heal{color:#9ff0a6}.pop.crit{color:#ffe27a;font-size:18px}
@keyframes rise{to{transform:translateY(-34px);opacity:0}}
.banner{position:absolute;left:0;right:0;top:42%;text-align:center;font-family:var(--display);font-size:26px;letter-spacing:.08em;padding:8px;background:rgba(10,11,16,.8);pointer-events:none;animation:ban 1.1s forwards;z-index:6}
.banner.p{color:var(--blue)}.banner.e{color:var(--red)}.banner.g{color:var(--green)}
@keyframes ban{0%{opacity:0}20%,75%{opacity:1}100%{opacity:0}}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);color:var(--fg);padding:6px 12px;border-radius:6px;font-weight:700;font-size:14px;z-index:8;white-space:nowrap;animation:ban 1.8s forwards;pointer-events:none}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.hint{color:var(--muted);margin:0;line-height:1.4}
.uc{display:flex;gap:10px;align-items:flex-start}
.por{width:56px;height:56px;object-fit:cover;background:var(--panel2);border-radius:6px;border:1px solid var(--line);flex:none}
.uc.e .por{background:#2d1d1f}
.uci{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ch{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ch b{font-family:var(--display);font-size:17px}
.ch span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.uc.p .ch b{color:var(--blue)}.uc.e .ch b{color:var(--red)}.uc.g .ch b{color:var(--green)}
.uc.g .por{background:#1d2d22}
.unit.g .hpb i{background:var(--green)}
.unit.stone img{filter:grayscale(1) brightness(.9) contrast(1.15)}
.side.r.g{background:#16301f;border-color:var(--green)}
.hp,.xp{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-size:12px}
.hp .bar,.xp .bar{flex:1;height:6px;background:#0d0f15;border-radius:3px;display:block}
.hp .bar i{display:block;height:100%;background:var(--green);border-radius:3px}
.xp .bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.hp span,.xp span{min-width:58px;text-align:right;color:var(--muted)}
.eq{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.eq img,.it img{width:20px;height:20px;image-rendering:pixelated}
.sk{color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;font-variant-numeric:tabular-nums}
.stats div{background:var(--ink);border-radius:4px;padding:3px 0;font-weight:700}
.stats small{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.skd{font-size:13px;color:var(--muted);margin:0}
.inv{display:flex;flex-direction:column;gap:2px}
.it{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;background:var(--ink);font-size:14px;border:1px solid transparent;color:var(--fg);font-weight:500;text-align:left}
.it .u{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
.it em{font-style:normal;font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
.it.eqd{border-color:color-mix(in srgb,var(--blue) 60%,transparent)}
button.it{width:100%;padding:6px}
button.it.sel{border-color:var(--gold)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{flex:1;min-width:64px}
.fc{display:grid;grid-template-columns:1fr auto 1fr;gap:3px 10px;align-items:center;font-variant-numeric:tabular-nums;text-align:center}
.fc .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.fc .nm{font-family:var(--display);font-size:15px}
.fc .pc{color:var(--blue)}.fc .ec{color:var(--red)}
.fc .big{font-size:17px;font-weight:700}
.wsel{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px}
.wsel img{width:22px;height:22px;image-rendering:pixelated}
.adv{color:var(--green)}.dis{color:var(--red)}

/* battle scene */
.bs{position:fixed;inset:0;z-index:50;background:#0b0c12;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.stage{position:relative;flex:1;overflow:hidden;background:linear-gradient(#121522,#2a3146 60%,#465066)}
.stage.forest{background:linear-gradient(#1d3020,#3f6440 60%,#6d8f62)}
.stage.castle{background:linear-gradient(#17141f,#352f45 60%,#4d4660)}
.stage.hill{background:linear-gradient(#3a2e2a,#7a6248 60%,#a68d6a)}
.stage::before{content:"";position:absolute;left:0;right:0;bottom:29%;height:38%;background:rgba(18,26,44,.38);clip-path:polygon(0 100%,0 62%,10% 22%,20% 58%,33% 8%,46% 52%,58% 24%,70% 62%,84% 12%,100% 48%,100% 100%)}
.ground{position:absolute;left:0;right:0;bottom:0;height:30%;background:#363b33}
.stage.forest .ground{background:#2e4325}.stage.castle .ground{background:#3e3a48}.stage.hill .ground{background:#6b5638}
.plat{position:absolute;bottom:24%;width:42%;height:6%;border-radius:50%;background:rgba(0,0,0,.28)}
.plat.l{left:3%}.plat.r{right:3%}
.fw{position:absolute;bottom:26%;width:min(36vw,170px);aspect-ratio:1}
.fw.l{left:7%}.fw.r{right:7%}
.fw img{width:100%;height:100%;image-rendering:pixelated;display:block}
.fw.r img{transform:scaleX(-1)}
.skb{position:absolute;top:8%;padding:6px 12px;font-family:var(--display);font-size:18px;letter-spacing:.06em;background:var(--gold);color:#1a1408;border-radius:4px;opacity:0;z-index:4}
.skb.l{left:5%}.skb.r{right:5%}
.flashv{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
.bnum{position:absolute;font-weight:700;font-size:26px;color:#fff;text-shadow:0 2px 0 #000,0 0 4px #000;z-index:4;pointer-events:none}
.bnum.miss{color:#c9cbd8}.bnum.crit{color:#ffe27a;font-size:30px}.bnum.heal{color:#9ff0a6}
.slash{position:absolute;width:110px;height:110px;border-radius:50%;border:6px solid transparent;border-top-color:#fff;border-right-color:rgba(255,255,255,.5);z-index:3;pointer-events:none}
.proj{position:absolute;z-index:3;pointer-events:none}
.proj.arrow{width:46px;height:4px;background:linear-gradient(90deg,#c9b98f,#efe6cf 80%,#fff);border-radius:2px}
.proj.fire{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#fff6c0,#ff9a3c 45%,#d2452f 70%,transparent 72%)}
.proj.water{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#eaf7ff,#4fb2ff 45%,#1f5f9f 70%,transparent 72%)}
.proj.wind{width:40px;height:40px;border-radius:50%;border:5px solid transparent;border-right-color:#9ff0c0;border-top-color:#d8ffe8}
.proj.light{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#fff,#fff3c4 40%,#e8c86a 65%,transparent 70%);box-shadow:0 0 14px #fff1b0}
.proj.illusion{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#fff,#e0b8ff 35%,#8a4fd8 65%,transparent 70%);box-shadow:0 0 12px #c58aff}
.proj.lightning{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle,#fff,#ffe14a 60%,transparent 70%)}
.rock{position:absolute;top:0;width:36px;height:30px;background:#9a7a4a;clip-path:polygon(20% 0,80% 8%,100% 55%,70% 100%,15% 90%,0 40%);z-index:3;pointer-events:none}
.proj.dark{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#e8d9ff,#8a5ad8 45%,#3b1f63 70%,transparent 72%)}
.proj.spin{width:26px;height:26px;border:4px solid #d0d6e2;border-radius:50% 0;}
.bolt{position:absolute;top:0;width:18px;background:linear-gradient(#fff9c4,#ffe04a);clip-path:polygon(40% 0,100% 0,60% 40%,100% 40%,20% 100%,40% 55%,0 55%);z-index:3;pointer-events:none}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 10px 4px}
.side{border-radius:6px;padding:8px;border:2px solid;display:flex;flex-direction:column;gap:4px;min-width:0}
.side.l{background:#3a1713;border-color:var(--red)}
.side.r{background:#14243f;border-color:var(--blue)}
.sn{font-family:var(--display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{display:flex;align-items:center;gap:4px;font-size:13px;color:#d9d4c4;white-space:nowrap;overflow:hidden}
.sw img{width:20px;height:20px;image-rendering:pixelated}
.ss{display:grid;grid-template-columns:auto 1fr;gap:0 8px;font-size:12px;font-variant-numeric:tabular-nums}
.ss span{color:#b8b5aa;letter-spacing:.06em}.ss b{text-align:right}
.shp{display:flex;align-items:center;gap:6px}
.shp b{font-size:18px;min-width:26px;font-variant-numeric:tabular-nums}
.hpbar{flex:1;height:10px;background:#07080c;border-radius:2px;overflow:hidden}
.hpbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,#a6f2ab 0 3px,#4fae58 3px 4px)}
.bstip{margin:0;text-align:center;font-size:12px;color:var(--muted);padding:2px 0 6px}
.expbox{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);background:var(--panel);border:2px solid var(--gold);padding:6px 12px;display:flex;gap:8px;align-items:center;font-weight:700;z-index:6;border-radius:6px;font-variant-numeric:tabular-nums}
.expbox .xb{width:120px;height:8px;background:#07080c;border-radius:2px;overflow:hidden}
.expbox .xb i{display:block;height:100%;background:var(--gold)}

/* unit sheet: FE-style two-page unit details */
.sheet{position:fixed;inset:0;z-index:65;background:rgba(8,9,14,.9);display:flex;justify-content:center;align-items:center;padding:12px;padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));touch-action:pan-y}
.sbx{box-sizing:border-box;width:100%;max-width:420px;max-height:100%;overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:10px;display:flex;flex-direction:column}
.sbx.p{border-color:color-mix(in srgb,var(--blue) 60%,var(--line))}.sbx.g{border-color:color-mix(in srgb,var(--green) 60%,var(--line))}.sbx.g .sn{color:var(--green)}.sbx.e{border-color:color-mix(in srgb,var(--red) 60%,var(--line))}
.snav{display:flex;align-items:center;gap:6px;padding:8px}
.snav span{flex:1;text-align:center;font-family:var(--display);color:var(--muted);letter-spacing:.06em;font-size:13px;font-variant-numeric:tabular-nums}
.snav button{min-width:44px;font-size:16px;padding:6px 10px}
.snav .sx{min-width:40px}
.shd{display:flex;gap:12px;align-items:center;padding:4px 14px 12px}
.shd>img{width:92px;height:92px;flex:none;image-rendering:pixelated;background:var(--panel2);border-radius:8px;border:2px solid var(--gold)}
.sbx.e .shd>img{background:#2d1d1f}
.shi{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.sn{font-family:var(--display);font-size:24px;letter-spacing:.04em;line-height:1.1}
.sbx.p .sn{color:var(--blue)}.sbx.e .sn{color:var(--red)}
.sc em{font-style:normal;font-family:var(--body);font-size:11px;color:#1a1408;background:var(--gold);border-radius:4px;padding:1px 5px;vertical-align:middle;letter-spacing:.06em;text-transform:uppercase}
.sc{font-family:var(--display);color:var(--fg);font-size:15px}
.slv{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.stabs{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--ink)}
.stabs button{flex:1;border:0;border-radius:0;background:none;color:var(--muted);font-family:var(--display);letter-spacing:.08em;padding:10px;border-bottom:2px solid transparent}
.stabs button.cur{color:var(--gold);border-bottom-color:var(--gold)}
.spg{min-height:430px;box-sizing:border-box;padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px}
.sl{font-family:var(--display);color:var(--gold);font-size:13px;letter-spacing:.06em}
.sgrid{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:44px 1fr 28px;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.srow b{text-align:right;font-size:16px}
.sbar{height:7px;background:#0d0f15;border-radius:4px;overflow:hidden}
.sbar i{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 55%,#000),var(--gold))}
.sinfo{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sinfo>div{background:var(--ink);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sinfo .wide{grid-column:1/-1}
.sinfo b{font-size:14px;font-weight:700}
.wts{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:14px}
.wt{display:inline-flex;align-items:center;gap:4px}
.wt img,.srit img{width:20px;height:20px;image-rendering:pixelated}
.sskill{background:var(--ink);border-radius:6px;padding:8px;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);display:flex;flex-direction:column;gap:2px}
.sskill p,.sid{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
.sid b{color:var(--fg)}.sid.dim{font-size:13px}
.scmb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-variant-numeric:tabular-nums}
.scmb div{background:var(--ink);border-radius:6px;padding:6px 8px;display:flex;justify-content:space-between;align-items:baseline}
.scmb b{font-size:17px}
.sitems{display:flex;flex-direction:column;gap:3px}
.srit{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-weight:500;padding:6px 8px;background:var(--ink);border-color:transparent}
.srit .e{width:16px;font-family:var(--display);color:var(--blue);font-weight:700}
.srit em{font-style:normal;font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
.srit .u{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.srit.eqd{border-color:color-mix(in srgb,var(--blue) 60%,transparent)}
.srit.sel{border-color:var(--gold)}
.srit.no{color:var(--muted)}
.srec{margin:0;color:var(--gold);font-size:14px}

/* ship, sky and palace tiles */
.underlay{position:absolute;left:0;top:0;image-rendering:pixelated;pointer-events:none}
.t-sky,.t-deck,.t-hull,.t-mast,.t-helm{background:transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.t-exit{background:radial-gradient(circle,#f3e6b0 0 20%,#c9a46a 22% 30%,transparent 33%),#4a4756}
.t-carpet{background:linear-gradient(90deg,#c9a46a 0 6%,#7a1f2a 6% 94%,#c9a46a 94%)}
.t-light{background:radial-gradient(circle,#fff6d0 0 28%,#e8cf8a 52%,#b89a5c)}
.tile.trap::before{inset:20%;background:radial-gradient(circle,#d7dae3 0 22%,transparent 26%) 0 0/50% 50%;opacity:.9}
.stage.sky{background:linear-gradient(#26304a,#56668c 60%,#8e9ab8)}.stage.sky .ground{background:#7a5230}
/* ship take-off scene */
.intro.shipsc{background:linear-gradient(#1f2740,#4a5878 60%,#8d97b5)}
.ss-cloud{position:absolute;left:-20%;width:140%;height:20%;background:radial-gradient(ellipse at 20% 50%,rgba(230,235,245,.35),transparent 60%),radial-gradient(ellipse at 70% 40%,rgba(230,235,245,.3),transparent 55%)}
.ss-cloud.c1{bottom:6%}.ss-cloud.c2{bottom:34%;opacity:.6}

.in-cap{position:absolute;left:0;right:0;bottom:calc(7% + env(safe-area-inset-bottom,0px));margin:0;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));text-align:center;font-family:var(--display);font-size:clamp(17px,4.6vw,22px);letter-spacing:.03em;color:#e8e2cf;text-wrap:balance;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}

@keyframes inFlicker{50%{opacity:.35}}
@keyframes inShake{25%{translate:-2px 0}75%{translate:2px 0}}

/* level 10 skill row */

/* ascension (class change) scene */
.asc{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:14px;overflow:auto;background:radial-gradient(ellipse at 50% 38%,#232a48 0,#0b0c14 72%);padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));animation:ascIn .5s ease-out}

.asc-wave{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border-radius:50%;border:3px solid #fff3c8;opacity:0;z-index:3;pointer-events:none}

.asc-box{box-sizing:border-box;width:100%;max-width:400px;background:var(--panel);border:2px solid var(--gold);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;animation:ascIn .4s ease-out}

@keyframes ascIn{from{opacity:0}}
@keyframes ascSpin{from{transform:rotateX(76deg) rotate(0)}to{transform:rotateX(76deg) rotate(360deg)}}
@keyframes ascP{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x),-230px)}}
@keyframes ascBob{50%{transform:translateY(-6px)}}
@keyframes ascPop{0%{transform:scale(1.35)}100%{transform:scale(1)}}

@keyframes ascFlash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}

.nm-squad img{width:40px;height:40px;image-rendering:pixelated}.nm-squad small{color:var(--muted)}
.dcard{position:relative;display:flex;gap:10px;align-items:center;text-align:left;padding:6px 8px}
.dcard.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--panel2))}
.dimg{flex:none;width:56px;height:56px;background:var(--panel2);border-radius:6px;display:grid;place-items:center}
.dimg img{width:56px;height:56px;image-rendering:pixelated}
.dtxt{display:flex;flex-direction:column;gap:1px;min-width:0;font-size:12px}
.dtxt>b{font-size:15px}.dcls{color:var(--gold)}.dst{color:var(--muted)}.dst b{color:var(--fg)}
.dsk{color:var(--muted)}.dsk img{width:14px;height:14px;image-rendering:pixelated;vertical-align:-2px;margin-right:2px}
.dtick{position:absolute;right:8px;top:6px;color:var(--gold);font-weight:700}
.title{position:fixed;inset:0;z-index:58;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(28px,8vh,64px);padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));background:linear-gradient(#0d0f18,#1a1e30 55%,#2a2233)}
.tsky{position:absolute;inset:0;pointer-events:none;background:
 linear-gradient(transparent 55%,rgba(13,15,24,.9)),
 radial-gradient(ellipse at 50% 120%,rgba(110,170,230,.22),transparent 60%)}
.tsky::before,.tsky::after{content:"";position:absolute;left:0;right:0;bottom:0}
.tsky::before{height:42%;background:#1b2034;clip-path:polygon(0 100%,0 55%,8% 30%,16% 50%,27% 12%,38% 46%,50% 20%,61% 52%,72% 18%,84% 44%,93% 26%,100% 40%,100% 100%)}
.tsky::after{height:26%;background:#11141f;clip-path:polygon(0 100%,0 50%,12% 30%,22% 58%,35% 34%,48% 62%,60% 28%,74% 56%,88% 32%,100% 52%,100% 100%)}
.tembers{position:absolute;inset:0;pointer-events:none}
.tembers i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:#bfe6ff;box-shadow:0 0 6px #7fc8ff;opacity:0;animation:ember linear infinite}
@keyframes ember{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}100%{transform:translate(30px,-90vh);opacity:0}}
.tlogo{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.tmark{width:64px;height:64px;filter:drop-shadow(0 0 14px rgba(127,200,255,.6));animation:flick 2.4s ease-in-out infinite}
@keyframes flick{50%{transform:scale(1.05) translateY(-2px)}}
.tname{font-family:var(--display);font-weight:700;font-size:clamp(44px,13vw,72px);line-height:1;margin:0;letter-spacing:.06em;color:var(--gold);text-shadow:0 2px 0 #2a2140,0 0 24px rgba(127,200,255,.4)}
.tsub{margin:0;color:#cbbf9f;font-size:14px;letter-spacing:.2em;text-transform:uppercase}
.tmenu{position:relative;display:flex;flex-direction:column;gap:10px;width:min(280px,100%)}
.tmenu button{font-family:var(--display);font-size:20px;letter-spacing:.08em;padding:12px;background:rgba(20,22,34,.72);border:1px solid rgba(216,177,90,.45);color:var(--fg)}
.tmenu button:first-child{border-color:var(--gold);color:var(--gold)}
.tmenu button:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){.tembers{display:none}.tmark{animation:none}}
.titlebig{font-family:var(--display);font-size:40px;color:var(--gold);margin:0;letter-spacing:.06em}
.heroes{display:flex;gap:4px;justify-content:center}
.heroes{flex-wrap:wrap}.heroes img{width:44px;height:44px;object-fit:cover;border-radius:6px}
@media (prefers-reduced-motion:reduce){.unit,.hpb i{transition:none}.pop,.banner,.toast,button.pulse,.tg::after{animation-duration:.01s}}

function foe(cls,lv,x,y,o={}){

function Px(w,h){const g=new Array(w*h).fill(null);const P={w,h,g,
  set(x,y,c){x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<w&&y<h)g[y*w+x]=c},
  rect(x,y,ww,hh,c){for(let j=0;j<hh;j++)for(let i=0;i<ww;i++)P.set(x+i,y+j,c)},
  ell(cx,cy,rx,ry,c,f){for(let y=Math.floor(cy-ry-1);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx-1);x<=Math.ceil(cx+rx);x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1&&(!f||f(x,y)))P.set(x,y,c)}},
  ring(cx,cy,r,c){for(let a=0;a<64;a++)P.set(cx+r*Math.cos(a/64*6.283),cy+r*Math.sin(a/64*6.283),c)},
  line(x0,y0,x1,y1,c,t=1){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1;for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;for(let a=0;a<t;a++)for(let b=0;b<t;b++)P.set(Math.round(x)+a,Math.round(y)+b,c)}},
  poly(pts,c){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;pts.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)});
    for(let y=Math.floor(y0);y<=Math.ceil(y1);y++)for(let x=Math.floor(x0);x<=Math.ceil(x1);x++){const px=x+.5,py=y+.5;let ins=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))ins=!ins}if(ins)P.set(x,y,c)}},
  outline(c){const o=g.slice();for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(o[y*w+x])continue;for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<w&&ny<h&&o[ny*w+nx]&&o[ny*w+nx]!==c){g[y*w+x]=c;break}}}},
  url(){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');for(let i=0;i<g.length;i++)if(g[i]){cx.fillStyle=g[i];cx.fillRect(i%w,(i/w)|0,1,1)}return cv.toDataURL()}

const isWpn=k=>WTYPES.includes(IT[k].t);

function mcost(u,x,y){const t=ter(x,y);if(CLS[u.cls].phase)return 1;if(t.k==='lava'&&CLS[u.cls].lava)return 1;if(CLS[u.cls].fly)return['wall','mast','cliff'].includes(t.k)?99:1;if(CLS[u.cls].mnt&&(t.k==='forest'||t.k==='hill'))return t.c+1;return t.c}

function calc(x,xw,y,yw,ctx){

  if(yw&&TRI[xw.t]===yw.t)adv=1;else if(yw&&TRI[yw.t]===xw.t)adv=-1;
  if(yw&&xw.t==='art'&&yw.t==='art'){if(ELE[xw.el]===yw.el)adv=1;else if(ELE[yw.el]===xw.el)adv=-1}

function slowOf(u){const C=CLS[u.cls];return ter(u.x,u.y).slow&&!C.fly&&!C.wade&&!C.phase?1:0}
function reach(u){
  const dist={[key(u.x,u.y)]:0},q=[[u.x,u.y]];
  while(q.length){
    q.sort((a,b)=>dist[key(...a)]-dist[key(...b)]);const[x,y]=q.shift(),d=dist[key(x,y)];
    for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
      const nd=d+mcost(u,nx,ny);if(nd>u.mov+relicMov(u)-slowOf(u))continue;const o=unitAt(nx,ny);if(o&&hostile(o,u))continue;
      const k=key(nx,ny);if(dist[k]===undefined||nd<dist[k]){dist[k]=nd;q.push([nx,ny])}}
  }
  const s=new Set();for(const k in dist){const[x,y]=k.split(',').map(Number),o=unitAt(x,y);if(!o||o===u)s.add(k)}return s;
}
function fringeOf(u,ms){
  const f=new Set(),r0=minRange(u),r1=maxRange(u);if(!r1)return f;
  for(const k of ms){const[x,y]=k.split(',').map(Number);for(let dy=-r1;dy<=r1;dy++)for(let dx=-r1;dx<=r1;dx++){const d=Math.abs(dx)+Math.abs(dy),nx=x+dx,ny=y+dy;if(d<r0||d>r1||nx<0||ny<0||nx>=MW||ny>=MH)continue;const kk=key(nx,ny);if(!ms.has(kk))f.add(kk)}}
  return f;
}

function healTargets(u){const si=staffIdx(u);if(si<0)return[];const w=IT[u.items[si].k];return state.units.filter(o=>o.hp>0&&o.team===u.team&&o!==u&&o.hp<o.maxhp&&man(u,o)>=w.r[0]&&man(u,o)<=w.r[1])}

function ensureVisible(x,y){const b=vb(),m=T*cam.s*1.2,px=cam.x+(x+.5)*T*cam.s,py=cam.y+(y+.5)*T*cam.s;if(px<m||px>b.w-m||py<m||py>b.h-m){centerOn(x,y,true);return true}return false}

  if(ptrs.size===1)gest={t:'tap',sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y};
  else if(ptrs.size===2){const[p,q]=[...ptrs.values()];gest={t:'pinch',d0:Math.hypot(p.x-q.x,p.y-q.y)||1,s0:cam.s,cx:cam.x,cy:cam.y,mx:(p.x+q.x)/2,my:(p.y+q.y)/2}}

function cycleSvg(nodes,R,lab){

  if(k==='grave'||k==='tomb'){p.rect(0,0,16,16,'#34303c');S.forEach(([x,y])=>{p.set(x,y,'#2a2630');p.set(x+1,y-1,'#47434f')})}
  if(k==='tomb'){o.ell(8,5,4,3,'#8a8794',(x,y)=>y<=5);o.rect(4,5,8,9,'#8a8794');o.rect(4,13,8,2,'#5a5762');o.rect(7,6,2,5,'#5a5762');o.rect(5,7,6,2,'#5a5762');o.rect(4,5,1,8,'#6f6c78')}

  if(k==='mangrove'){o.line(2,15,5,8,'#5a3a24',2);o.line(13,15,10,8,'#5a3a24',2);o.line(7,15,7,8,'#4a2e1c',2);o.ell(8,5,7,4.5,'#2f5a32');o.ell(5,4,3,2,'#3f7a42');o.ell(11,5,3,2,'#3f7a42')}
  if(k==='sand'){p.rect(0,0,16,16,'#b8a070');dots('#a08858',S);dots('#d0bc8c',[[3,2],[10,1],[14,5],[5,11],[12,12]])}
  if(k==='curse'){p.rect(0,0,16,16,'#3e4436');o.line(1,14,6,3,'#3a2a3a',2);o.line(14,14,9,2,'#3a2a3a',2);o.line(4,9,12,5,'#4a2e4a');o.line(3,6,13,11,'#4a2e4a');o.set(6,3,'#c77dff');o.set(9,2,'#c77dff');o.set(12,5,'#8a3a6a')}
  if(k==='basalt'){p.rect(0,0,16,16,'#3a3034');p.line(2,4,6,7,'#2a2226');p.line(6,7,5,12,'#2a2226');p.line(10,2,13,9,'#2a2226');p.set(6,8,'#ff7a2a');p.set(12,6,'#c84a1a')}

  return p.url();
}

/* ---- node map ----
   ROWS floors of 3 lanes, then the boss. Every path from floor 1 to the boss holds exactly the rooms in MIX
   (battles and elites both count as combat). Lanes are shuffles of the same mix, and a crossing between lanes
   is only kept if every path through the map still matches MIX, so no route can dodge the treasure room. */
const MIX={battle:4,recruit:1,tavern:1,rest:1,event:1,treasure:1};
const ROWS=Object.values(MIX).reduce((a,b)=>a+b,0);

const NODE_D={tavern:'Spend gold on drinks, food and sellswords, and hear the local rumours.',battle:'Fight monsters for EXP and loot.',elite:'A tougher fight with a strong leader. Drops an Ascension Fragment.',recruit:'Pick 1 of 3 new units.',rest:'Train one unit: it gains a level.',
  event:'Something unexpected: a smith, a shrine, an old armoury…',treasure:'A treasure room. Pick 1 of 3 items.',boss:'The act boss.'};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function laneOk(a){
  if(a[0]!=='battle'||a[1]==='rest')return false;
  for(let i=0;i+2<a.length;i++)if(a[i]==='battle'&&a[i+1]==='battle'&&a[i+2]==='battle')return false;
  for(let i=0;i+1<a.length;i++)if(a[i]===a[i+1]&&a[i]!=='battle')return false;
  return true;
}
function laneFrom(base){
  for(let k=0;k<200;k++){const a=base?base.slice():shuffle(Object.entries(MIX).flatMap(([t,n])=>Array(n).fill(t)));
    if(base)for(let s=0;s<2;s++){const i=ri(1,ROWS-1),j=ri(1,ROWS-1);[a[i],a[j]]=[a[j],a[i]]}
    if(laneOk(a))return a}
  return base.slice();
}
function pathsOk(rows){
  /* room counts packed into one number, one decimal digit per room type */
  const K=Object.keys(MIX),P=Object.fromEntries(K.map((k,i)=>[k,10**i])),want=K.reduce((a,k)=>a+MIX[k]*P[k],0);
  const walk=(r,i,c)=>{c+=P[rows[r][i].t];return r===ROWS-1?c===want:rows[r][i].next.every(j=>walk(r+1,j,c))};
  return rows[0].every((_,i)=>walk(0,i,0));
}
function genMap(){
  const l0=laneFrom(null),lanes=[laneFrom(l0),l0,laneFrom(l0)],rows=[];
  for(let r=0;r<ROWS;r++)rows.push(lanes.map(l=>({t:l[r],next:[]})));
  for(let r=0;r<ROWS-1;r++)rows[r].forEach((n,i)=>n.next=[i]);
  const cand=[];for(let r=0;r<ROWS-1;r++)for(let i=0;i<3;i++)for(const j of[i-1,i+1])if(j>=0&&j<3)cand.push([r,i,j]);
  for(const[r,i,j]of shuffle(cand)){if(rand()<.35)continue;rows[r][i].next.push(j);if(!pathsOk(rows))rows[r][i].next.pop()}
  rows.forEach((row,r)=>row.forEach(n=>{if(n.t==='battle'&&r>=4&&rand()<.35)n.t='elite'}));
  rows.push([{t:'boss',next:[]}]);rows[ROWS-1].forEach(n=>n.next=[0]);
  rows.forEach(row=>row.forEach((n,i)=>n.x=row.length===1?50:18+i*32+ri(-5,5)));
  return{rows};
}

function tavernArt(){const c='TAV';if(sprCache[c])return sprCache[c];const W=160,H=90,p=Px(W,H);
  p.rect(0,0,W,H,'#4a3020');for(let x=0;x<W;x+=12)p.rect(x,0,1,H,'#3a2418');for(let x=6;x<W;x+=12)for(let y=6;y<60;y+=20)p.set(x,y,'#6a4a30');
  p.rect(8,10,28,22,'#2a1a10');p.rect(10,12,24,18,'#1a2240');p.rect(21,12,2,18,'#2a1a10');p.rect(10,20,24,2,'#2a1a10');[[13,14],[28,15],[16,25],[30,26],[25,13]].forEach(([x,y])=>p.set(x,y,'#f3f0e8'));p.ell(31,16,2,2,'#f3e6b0');
  for(const sy of[24,44]){p.rect(46,sy,106,3,'#2a1a10');p.rect(46,sy,106,1,'#6a4a30');
    for(let i=0;i<11;i++){const x=50+i*9,col=['#3a6a3a','#7a2a2a','#2a4a6a','#a8743a','#5a3a6a'][(i+sy)%5],h=7+(i*3+sy)%5;
      if((i+sy)%4===3){p.rect(x-1,sy-6,7,6,'#c9a070');p.rect(x-1,sy-6,7,1,'#a8743a');continue}
      p.rect(x,sy-h,5,h,col);p.rect(x+1,sy-h-3,3,3,col);p.rect(x+1,sy-h-4,3,1,'#c9a070');p.rect(x+1,sy-h+2,1,h-4,shade(col,1.4))}}
  p.ell(150,10,9,9,'#5a3a24');p.ell(150,10,4,5,'#ffd27a');p.ell(150,10,2,3,'#fff6d0');p.line(150,0,150,4,'#2a1a10');
  p.ell(14,62,8,10,'#7a5230');p.rect(6,56,16,2,'#4a2e1a');p.rect(6,66,16,2,'#4a2e1a');p.ell(14,52,8,2,'#8a6040');
  p.rect(0,70,W,20,'#2a1a12');for(let x=0;x<W;x+=20)p.rect(x,70,1,20,'#1e120c');

const tavEl=document.createElement('div');tavEl.className='tav';tavEl.hidden=true;document.body.appendChild(tavEl);
function tavShow(text,opts){
  /* opts: [key,label,sub?,disabled?] -> resolves with the chosen key */
  tavEl.querySelector('.tv-text').innerHTML=text;
  tavEl.querySelector('.tv-gold').textContent=gold()+' gold';
  tavEl.querySelector('.tv-opts').innerHTML=opts.map(([k,l,sub,dis])=>`<button type="button" class="tv-o" data-t="${k}"${dis?' disabled':''}>${l}${sub?`<span>${sub}</span>`:''}</button>`).join('');
  return new Promise(res=>{tavEl.onclick=e=>{const b=e.target.closest('[data-t]');if(!b||b.disabled)return;sfx('tick');res(b.dataset.t)}});
}
function spend(n){run.gold=gold()-n;sfx('item')}
async function tavernNode(){
  const look={...KEEPER.look},keeper=fig(look,'Heir','g','idle',null),bought=new Set(),B=actBiome();
  const hires=Array.from({length:3},()=>{const lv=Math.max(1,Math.round(run.roster.reduce((a,u)=>a+u.lv,0)/run.roster.length)+ri(-1,1));return genUnit(lv)});
  const price=u=>40+15*u.lv;
  tavEl.innerHTML=`<div class="tv-scene"><img class="tv-bg" src="${tavernArt()}" alt=""><img class="tv-keeper" src="${keeper}" alt="${KEEPER.name}"><img class="tv-counter" src="${counterArt()}" alt=""><span class="tv-gold"></span></div>
    <div class="tv-box"><div class="tv-name">${KEEPER.name}, the innkeeper</div><p class="tv-text"></p><div class="tv-opts"></div></div>`;
  tavEl.hidden=false;music('tavern');
  let text=pick(GREET);
  for(;;){
    const m=await tavShow(text,[['drink','Drinks at the bar','Ale, spirits and tea'],['food','Something to eat',`Buffs for a few fights${(run.meals||[]).length?` · ${run.meals.length} active`:''}`],['hire','Anyone looking for work?',`${hires.length} sellsword${hires.length===1?'':'s'} at the tables`],['rumour','Heard any rumours?',''],['leave','Head back out','']]);
    if(m==='leave'){tavEl.hidden=true;tavEl.onclick=null;music(B.id);return}
    if(m==='rumour'){text=pick([`“They say ${B.boss.name||'a minotaur lord'} is waiting at the end of the ${B.n}. ${B.tip[2]}”`,`“A traveller came through last week, white as milk. Said the ${B.n} is no place for the unprepared. ${B.tip[2]}”`]);continue}
    if(m==='drink'){
      for(;;){const d=await tavShow('“Here’s what I’m pouring tonight.”',[...Object.entries(DRINKS).map(([k,x])=>[k,`<img class="tv-ic" src="${mugArt()}" alt="">${x.n} · ${x.p}g`,x.d+(bought.has(k)?' (sold out)':''),bought.has(k)||gold()<x.p]),['back','Back','']]);
        if(d==='back')break;const x=DRINKS[d];
        if(x.all){spend(x.p);bought.add(d);tavEl.hidden=true;for(const u of run.roster){const g=gainExp(u,30);if(g&&g.gains)await levelUp(u,g)}tavEl.hidden=false;text='“To the march!” The whole squad drinks, and tells each other stories that get bigger with every round.';break}
        tavEl.hidden=true;const u=await pickUnit(`Who drinks the ${x.n}?`,x.d);tavEl.hidden=false;if(!u)continue;
        spend(x.p);bought.add(d);const ss=[].concat(x.st(u));ss.forEach(s=>{if(s==='hp'){u.maxhp++;u.hp++}else u[s]++});
        text=`${u.name} downs the ${x.n}. ${ss.map(s=>SL[s]+' +1').join(', ')}. “Steady now.”`;break}
      continue}
    if(m==='food'){
      const act=(run.meals||[]).map(x=>`${MEALS[x.id].n} (${x.n} fight${x.n>1?'s':''} left)`).join(', ');
      const f=await tavShow(`“Kitchen’s open. It all lasts a few fights, for the whole table.”${act?` Still in your bellies: ${act}.`:''}`,[...Object.entries(MEALS).map(([k,x])=>[k,`<img class="tv-ic" src="${mealArt(k)}" alt="">${x.n} · ${x.p}g`,`${x.d} for ${x.f} fights${M(k)?' (already eaten)':''}`,M(k)||gold()<x.p]),['back','Back','']]);
      if(f!=='back'){spend(MEALS[f].p);(run.meals=run.meals||[]).push({id:f,n:MEALS[f].f});text=`The ${MEALS[f].n} arrives steaming. ${MEALS[f].d} for the next ${MEALS[f].f} fights.`}
      continue}
    if(m==='hire'){
      if(!hires.length){text='“That’s everyone who wanted work tonight.”';continue}
      const full=run.roster.length>=TEAM_CAP;
      const h=await tavShow(`“They’ll follow you for the right price.”${full?` Your squad is full (${TEAM_CAP}), so someone would have to stay behind.`:''}`,[...hires.map((u,i)=>['h'+i,`<img class="tv-spr" src="${uSpr(u)}" alt="">${u.name} · ${price(u)}g`,`${CLS[u.cls].n} · Lv ${u.lv} · HP ${u.maxhp} Str ${u.str} Mag ${u.mag} Spd ${u.spd} Def ${u.def}`,gold()<price(u)]),['back','Back','']]);
      if(h==='back')continue;const nu=hires[+h.slice(1)];
      if(full){tavEl.hidden=true;const d=await modal(`<h2>Who stays behind?</h2><p>${nu.name} takes their place.</p><div class="draft">${run.roster.map((u,i)=>`<button type="button" class="dcard" data-m="d${i}">${unitCard(u)}</button>`).join('')}</div><div class="mbtns"><button type="button" data-m="skip">Keep my squad</button></div>`);tavEl.hidden=false;
        if(d==='skip')continue;run.roster.splice(+d.slice(1),1)}
      spend(price(nu));run.roster.push(nu);hires.splice(hires.indexOf(nu),1);text=`${nu.name} finishes their drink and picks up their gear. “When do we leave?”`;continue}
  }
}

/* ---- flow ---- */
async function beginBattle(){
  run.fights=(run.fights||0)+1;const def=genBattle(run.fights,run.kind);CH.length=0;CH.push(def);
  setupChapter(0,run.roster);rewinds=3;saveGame();music(def.biome);await chapterIntro();
}
async function newRun(){
  const seed=(Date.now()^Math.floor(Math.random()*1e9))>>>0;seedRng(seed);
  run={seed,n:0,uid:1,roster:[],pos:null,path:[],act:1,relics:[],ess:0,rr:{},gold:30,meals:[]};run.biomes=shuffle(Object.keys(BIOMES)).slice(0,ACTS);
  const opts=Array.from({length:unl('draft6')?6:5},()=>genUnit(unl('veterans')?2:1));
  const squad=await draftPick(opts,3);if(!squad)return false;
  run.roster=squad;titleEl.hidden=true;
  if(unl('startRelic'))await relicPick(2,['c','u'],'An heirloom','Choose a relic to carry from the start.');
  run.map=genMap();await mapStep();return true;
}
async function titleScreen(){
  music('title');
  for(;;){
    const sv=loadGame(),items=[];
    if(sv&&sv.run)items.push(['cont','Continue']);
    items.push(['new','New March'],['camp',`Camp · ${prof.essence} Essence`],['opts','Options']);
    const m=await titleMenu(items);
    if(m==='opts'){await optionsMenu(true);continue}
    if(m==='camp'){await campScreen();continue}
    if(m==='cont'){titleEl.hidden=true;restore(sv);if(run.phase==='map')mapStep();else banner('Player Phase','p');return}
    if(await newRun())return;
  }
}
async function winScreen(){
  await sleep(600);
  const survivors=state.units.filter(u=>u.team==='p'),fallen=chStart.units.filter(s=>s.team==='p'&&!survivors.some(u=>u.id===s.id));
  run.roster=survivors.map(u=>{const r=clone(u);r.hp=r.maxhp;r.acted=false;r.stone=0;return r});
  const bossWin=run.kind==='boss',final=bossWin&&(run.act||1)>=ACTS,gain=bossWin?20:run.kind==='elite'?8:4,rw=battleRewards();
  run.ess=(run.ess||0)+gain+(final?20:0);const gg=GOLDWIN[run.kind]||GOLDWIN.battle;run.gold=gold()+gg;afterFightMeals();
  const ro=survivors.map(u=>`<div><img src="${portrait(u)}" alt="">${u.name}<span class="hint">Lv ${u.lv}</span></div>`).join('')+fallen.map(u=>`<div class="dead"><img src="${portrait(u)}" alt="">${u.name}<span class="hint">Fallen</span></div>`).join('');
  await modal(`<div class="eyebrow">Act ${run.act||1} · Floor ${run.n} of ${RUN_LEN} won · Turn ${state.turn}</div><h2>${CH[0].title}</h2><p>${final?'The march is complete.':bossWin?`The ${actBiome().n} is cleared. The road leads on to the ${BIOMES[run.biomes[run.act]].n}.`:'Survivors heal fully before the next room.'}</p><div class="roster">${ro}</div><p>${rw.length?`Found: ${rw.join(', ')}. `:''}<span class="ess">+${gain+(final?20:0)} Essence</span> · <span class="gold">+${gg} gold</span></p><div class="mbtns"><button class="go" type="button" data-m="next">${final?'Finish':'March on'}</button></div>`);
  if(run.kind==='elite')await relicPick(2,['c','u'],'The elite’s spoils','Take one relic. It lasts for the rest of the run.');
  if(bossWin&&!final)await relicPick(3,['u','r'],'The boss’s hoard','Take one relic. It lasts for the rest of the run.');
  if(final){const got=bankEssence(true);await modal(`<div class="eyebrow">Victory · Seed ${run.seed}</div><h2>The march is complete</h2><p>${run.roster.length} of your squad made it to the end. <span class="ess">${got} Essence</span> banked for the Camp.</p><div class="roster">${run.roster.map(u=>`<div><img src="${portrait(u)}" alt="">${u.name}<span class="hint">${CLS[u.cls].n}</span></div>`).join('')}</div><div class="mbtns"><button class="go" type="button" data-m="ok">Back to title</button></div>`);
    try{localStorage.removeItem(SAVE)}catch(_){}run=null;titleScreen();return}
  if(bossWin){run.act=(run.act||1)+1;run.map=genMap();run.pos=null;run.path=[];const B=actBiome();
    await modal(`<div class="eyebrow">Act ${run.act}</div><h2>${B.n}</h2><p>${B.d}</p><div class="mbtns"><button class="go" type="button" data-m="ok">March on</button></div>`)}
  await mapStep();
}
async function loseScreen(){
  await sleep(500);const can=settings.rewind&&rewinds>0&&history.length;
  const m=await modal(`<div class="eyebrow">Defeat</div><h2>The march ends</h2><p>Your squad fell in Act ${run.act||1}, floor ${run.n} of ${RUN_LEN}. Seed ${run.seed}. Half your Essence is kept: <span class="ess">${Math.floor((run.ess||0)/2)}</span>.</p>${can?`<p>You have ${rewinds} rewind${rewinds>1?'s':''} left.</p>`:''}<div class="mbtns">${can?'<button class="go" type="button" data-m="rewind">Rewind</button>':''}<button type="button" data-m="title">Back to title</button></div>`);
  if(m==='rewind'){rewind();return}
  bankEssence(false);try{localStorage.removeItem(SAVE)}catch(_){}run=null;titleScreen();
}
function rewind(){if(!settings.rewind||rewinds<=0||!history.length||busy)return;if(ui!=='idle')cancelMove();state=history.pop();rewinds--;over=null;phase='player';clearSel();ui='idle';render();saveGame()}
function restore(d){
  run=d.run;seedRng(d.rng);
  const fix=us=>us.forEach(u=>{ensureCls(u.cls);u.items.forEach(it=>ensureIt(it.k))});
  fix(run.roster);if(run.phase==='map')return;
  CH.length=0;CH.push(d.def);
  fix([...d.state.units,...(d.chStart?d.chStart.units:[])]);
  state=d.state;history=d.history||[];rewinds=d.rewinds??3;chStart=d.chStart||clone(state);enterMap();
}
/* ---- story scenes ---- */
const storyEl=document.createElement('div');storyEl.className='story';storyEl.hidden=true;document.body.appendChild(storyEl);
function speaker(id){
  if(id==='narrator')return{name:'',img:null,side:'c'};
  const u=state&&state.units.find(x=>x.id===id);
  if(u)return{name:u.name,img:portrait(u),side:u.team==='p'?'l':'r'};
  const h=heroDef(id);if(h)return{name:h.name,img:picOf(h),side:'l'};
  return{name:id,img:null,side:'r'};
}
function playStory(lines){
  if(!lines||!lines.length)return Promise.resolve();
  return new Promise(res=>{
    let i=0,typing=null,full='';
    storyEl.innerHTML=`<button type="button" class="mini sskip">Skip</button>${settings.dev?'<button type="button" class="mini sback">◀ Back · Dev</button>':''}<div class="sstage"><img class="spor l" alt="" hidden><img class="spor r" alt="" hidden></div><div class="sbox"><b class="sname"></b><p class="stext"></p><span class="snext">Tap to continue ▾</span></div>`;
    storyEl.hidden=false;
    const pl=storyEl.querySelector('.spor.l'),pr=storyEl.querySelector('.spor.r'),nm=storyEl.querySelector('.sname'),tx=storyEl.querySelector('.stext');
    const finish=()=>{storyEl.hidden=true;storyEl.onclick=null;res()};
    function show(){
      if(i>=lines.length)return finish();
      const[id,text]=lines[i],sp=speaker(id);full=text.replaceAll('{lord}',lordName());
      nm.textContent=sp.name;nm.hidden=!sp.name;tx.classList.toggle('narr',sp.side==='c');
      for(const[img,s]of[[pl,'l'],[pr,'r']]){
        if(sp.side===s&&sp.img){if(img.dataset.src!==sp.img){img.src=sp.img;img.dataset.src=sp.img;img.animate([{opacity:0,translate:`${s==='l'?-30:30}px 0`},{opacity:1,translate:'0 0'}],{duration:260})}img.classList.add('on');img.hidden=false}
        else img.classList.remove('on');
      }
      if(sp.side==='c'){pl.hidden=true;pr.hidden=true}
      let n=0;tx.textContent='';clearInterval(typing);
      typing=setInterval(()=>{n+=2;tx.textContent=full.slice(0,n);if(n%6===0)sfx('tick');if(n>=full.length){clearInterval(typing);typing=null}},28);
    }
    storyEl.onclick=e=>{
      if(e.target.closest('.sskip')){clearInterval(typing);return finish()}
      if(e.target.closest('.sback')){clearInterval(typing);typing=null;i=Math.max(0,i-1);show();return}
      if(typing){clearInterval(typing);typing=null;tx.textContent=full;return}
      i++;show();
    };
    show();
  });
}

$('#btnEnd').addEventListener('click',async()=>{if(busy||over||phase!=='player'||!modalEl.hidden)return;if(ui!=='idle')cancelMove();
  const left=state.units.filter(u=>u.team==='p'&&!u.acted).length;

$('#btnRewind').addEventListener('click',rewind);
$('#btnDanger').addEventListener('click',()=>{danger=!danger;render();if(danger)tip('danger','Danger zone','Red tiles are where enemies can strike next turn. Tap a tile, or move a unit onto one, to see which enemies they are.')});
$('#btnOpts').addEventListener('click',()=>{if(!busy)optionsMenu()});
$('#btnDev').addEventListener('click',()=>{if(!busy&&!over&&modalEl.hidden)devMenu()});
/* Dev mode: win the current battle straight away. */
async function devMenu(){
  const m=await modal(`<div class="eyebrow">Dev mode</div><h2>Skip ahead</h2><p>Win this battle straight away. Seed ${run?run.seed:'-'}.</p><div class="mbtns"><button type="button" data-m="close">Close</button><button class="go" type="button" data-m="win">Win this battle</button></div>`);
  if(m==='win'){cancelMove();over='win';render();winScreen()}

function start(data){
  loadProf();
  try{const o=JSON.parse(localStorage.getItem(OPTS));if(o)settings=Object.assign(settings,o)}catch(_){}
  if(data&&data.run&&data.state){restore(data);return}
  /* A throwaway battle sits behind the title screen. */
  seedRng(7);run={seed:7,n:1,uid:1,roster:[]};run.roster=[genUnit(1),genUnit(1),genUnit(1)];CH.length=0;CH.push(genBattle(1));setupChapter(0,run.roster);run=null;
  titleScreen();
}
window.claude?.hot?.snapshot?.(()=>({state,history,rewinds,chStart,run,def:CH[0],rng:rngS}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
